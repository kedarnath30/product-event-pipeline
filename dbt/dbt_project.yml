name: product_events
version: "1.0.0"
config-version: 2
profile: product_events

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The synthetic stream has its own clock. The orchestrator passes the stream's
  # "now" so freshness/volume tests are deterministic on re-runs and in CI.
  pipeline_as_of: "2026-10-01 00:00:00"
  session_timeout_minutes: 30
  funnel_maturity_days: 14
  max_quarantine_rate: 0.05

models:
  product_events:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
