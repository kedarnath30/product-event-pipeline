product_events:
  target: dev
  outputs:
    dev:
      type: duckdb
      # absolute path is passed by the orchestrator / CI; default works when run from dbt/
      path: "{{ env_var('PEP_DUCKDB_PATH', '../warehouse/events.duckdb') }}"
      threads: 2
      settings:
        memory_limit: "{{ env_var('PEP_DUCKDB_MEMORY_LIMIT', '1GB') }}"
